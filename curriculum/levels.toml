  { topic = "requirements and injected ports", sublevels = ["capstone-requirements", "capstone-architecture", "sensor-interface", "sample-validation", "timestamp-injection", "data-logger-integration", "data-logger-release"] },
  { topic = "buffering, serialization, and persistence", sublevels = ["record-buffer", "record-serialization", "storage-interface", "transport-retry", "data-logger-integration", "data-logger-release"] },
