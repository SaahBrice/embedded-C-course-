id = "compiler-warnings"
title = "Treat Warnings as Defects"
version = "2.0.0"
order = 30
stage = 1
activity = "debug"
duration_minutes = 50
platform = "host"
prerequisites = ["workstation-orientation"]
objectives = ["Explain diagnostics in an embedded C context", "Apply warning flags with explicit boundary behavior", "Produce and interpret executable engineering evidence"]
starter = "starter"
hints = ["hints/01.md", "hints/02.md", "hints/03.md"]

[content]
briefing = "briefing.md"
lesson = "lesson.md"
debrief = "debrief.md"
solution = "solution.md"

[[checks]]
id = "immutable-c-contract"
name = "Strict build and immutable behavior tests"
type = "c_harness"
sources = ["task.c"]
harness = "checks/test.c"
cflags = ["-std=c11", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-O0", "-g", "-Wconversion", "-Wsign-conversion"]
timeout = 20
required = true
