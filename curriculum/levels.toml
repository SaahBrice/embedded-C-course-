  { topic = "startup, linking, and memory layout", sublevels = ["startup-code", "linker-scripts", "memory-sections", "boot-flow", "real-time-analysis"] },
  { topic = "bounded scheduling and deadlines", sublevels = ["startup-code", "boot-flow", "cooperative-scheduler", "real-time-analysis", "rtos-concepts"] },
  { topic = "firmware architecture tradeoffs", sublevels = ["linker-scripts", "memory-sections", "boot-flow", "cooperative-scheduler", "real-time-analysis", "rtos-concepts"] },
]

