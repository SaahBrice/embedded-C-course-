id = "peripheral-console-release"
title = "Release: Peripheral Console"
version = "2.0.0"
order = 530
stage = 6
activity = "integrate"
duration_minutes = 50
platform = "sim"
prerequisites = ["stm32-board-checkpoint"]
objectives = ["Explain GPIO in an embedded C context", "Apply timer with explicit boundary behavior", "Produce and interpret executable engineering evidence"]
starter = "starter"
hints = ["hints/01.md", "hints/02.md", "hints/03.md"]

[content]
briefing = "briefing.md"
lesson = "lesson.md"
debrief = "debrief.md"
solution = "solution.md"

[[checks]]
id = "immutable-c-contract"
name = "Strict build and immutable behavior tests"
type = "c_harness"
sources = ["task.c"]
harness = "checks/test.c"
cflags = ["-std=c11", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-O0", "-g"]
timeout = 20
required = true
support_sources = ["platforms/host/src/sim_uart.c", "platforms/host/src/sim_gpio.c"]
support_include_dirs = ["platforms/host/include"]
