[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-c-career-game"
version = "1.0.0"
description = "A guided terminal career game for learning embedded C"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["learn_engine*"]
