id = "stm32-toolchain-checkpoint"
title = "Prepare the STM32 Toolchain"
version = "2.0.0"
order = 510
stage = 6
activity = "hardware"
duration_minutes = 50
platform = "stm32"
prerequisites = ["i2c"]
objectives = ["Explain ARM compiler in an embedded C context", "Apply debug probe with explicit boundary behavior", "Produce and interpret executable engineering evidence"]
starter = "starter"
hints = ["hints/01.md", "hints/02.md", "hints/03.md"]

[content]
briefing = "briefing.md"
lesson = "lesson.md"
debrief = "debrief.md"
solution = "solution.md"

[[checks]]
id = "immutable-c-contract"
name = "Strict build and immutable behavior tests"
type = "c_harness"
sources = ["task.c"]
harness = "checks/test.c"
cflags = ["-std=c11", "-Wall", "-Wextra", "-Wpedantic", "-Werror", "-O0", "-g"]
timeout = 20
required = true
